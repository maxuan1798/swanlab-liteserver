services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: swanlab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-swanlab123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-swanlab_cloud}
      MYSQL_USER: ${MYSQL_USER:-swanlab_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-swanlab456}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    networks:
      - swanlab-network
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=1000
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-swanlab123}"]
      timeout: 20s
      retries: 10
      interval: 30s
      start_period: 60s

  # SwanLab-Dashboard服务
  swanlab-dashboard:
    build: .
    container_name: swanlab-dashboard
    restart: unless-stopped
    environment:
      # 云端同步配置
      SWANLAB_CLOUD_SYNC: ${SWANLAB_CLOUD_SYNC:-false}

      # MySQL配置（用于云端同步的MySQL模式）
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-swanlab_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-swanlab456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-swanlab_cloud}
      MYSQL_CHARSET: utf8mb4
      MYSQL_MAX_CONNECTIONS: 20

      # API配置（用于HTTP模式）
      SWANLAB_API_HOST: http://localhost:5173/api/v1/cloud
      SWANLAB_API_KEY: ${SWANLAB_API_KEY:-}
      SWANLAB_WORKSPACE: ${SWANLAB_WORKSPACE:-default}
      SWANLAB_CLOUD_TIMEOUT: 30

      # 权限配置
      SWANLAB_ALLOWED_WORKSPACES: ${SWANLAB_ALLOWED_WORKSPACES:-default,demo,test}

      # 数据目录
      SWANLAB_LOG_DIR: /app/logs
      SWANLAB_DATA_DIR: /app/data

      # Python配置
      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
    ports:
      - "${DASHBOARD_PORT:-5173}:5173"
    volumes:
      - swanlab_data:/app/data
      - swanlab_logs:/app/logs
      # 如果需要持久化本地数据，取消注释下面的行
      # - ./swanlog:/app/swanlog
    networks:
      - swanlab-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/api/v1/cloud/health"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 60s

  # Redis缓存服务（可选，用于会话存储和缓存）
  redis:
    image: redis:7-alpine
    container_name: swanlab-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - swanlab-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
      interval: 10s

  # Nginx反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: swanlab-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - swanlab-network
    depends_on:
      - swanlab-dashboard
    profiles:
      - production

# 网络配置
networks:
  swanlab-network:
    driver: bridge

# 数据卷配置
volumes:
  mysql_data:
    driver: local
  swanlab_data:
    driver: local
  swanlab_logs:
    driver: local
  redis_data:
    driver: local