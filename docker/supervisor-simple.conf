[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# MySQL服务
[program:mysql]
command=/usr/sbin/mysqld --user=mysql --console --bind-address=0.0.0.0
autostart=true
autorestart=true
priority=100
stdout_logfile=/var/log/mysql/mysql.log
stderr_logfile=/var/log/mysql/mysql.error.log
user=mysql
startsecs=15
startretries=3
environment=MYSQL_ROOT_PASSWORD="%(ENV_MYSQL_ROOT_PASSWORD)s"

# Redis服务
[program:redis]
command=/usr/bin/redis-server --daemonize no --bind 127.0.0.1 --port 6379
autostart=true
autorestart=true
priority=200
stdout_logfile=/var/log/redis/redis.log
stderr_logfile=/var/log/redis/redis.error.log
user=redis
startsecs=5
startretries=3

[program:clickhouse]
command=/usr/bin/clickhouse-server --config-file=/etc/clickhouse-server/config.xml --pid-file=/var/run/clickhouse-server/clickhouse-server.pid
user=clickhouse
autostart=true
autorestart=true
startsecs=10
startretries=10
stdout_logfile=/var/log/supervisor/clickhouse.log
stderr_logfile=/var/log/supervisor/clickhouse.err.log
priority=20
environment=HOME="/var/lib/clickhouse"

# MinIO服务
[program:minio]
command=/usr/local/bin/minio server /data/minio --address :9100 --console-address :9101
autostart=true
autorestart=true
priority=400
stdout_logfile=/var/log/minio/minio.log
stderr_logfile=/var/log/minio/minio.error.log
environment=MINIO_ROOT_USER="%(ENV_MINIO_ROOT_USER)s",MINIO_ROOT_PASSWORD="%(ENV_MINIO_ROOT_PASSWORD)s"
user=root
startsecs=5
startretries=3

# Nginx服务 (简化命令)
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=500
stdout_logfile=/var/log/nginx/nginx.log
stderr_logfile=/var/log/nginx/nginx.error.log
user=root
startsecs=5
startretries=3

# Fluent Bit服务 (日志收集，依赖ClickHouse)
[program:fluent-bit]
command=/opt/fluent-bit/bin/fluent-bit -c /etc/fluent-bit/fluent-bit.conf
autostart=true
autorestart=true
priority=550
stdout_logfile=/var/log/fluent-bit/fluent-bit.log
stderr_logfile=/var/log/fluent-bit/fluent-bit.error.log
environment=CLICKHOUSE_HOST="localhost",CLICKHOUSE_PORT="8123",CLICKHOUSE_USER="%(ENV_CLICKHOUSE_USER)s",CLICKHOUSE_PASS="%(ENV_CLICKHOUSE_PASSWORD)s",LOG_PATH="/app/logs/*.log"
user=root
startsecs=10
startretries=3

# SwanLab服务器 (最后启动，依赖其他服务)
[program:swanlab]
command=/usr/bin/python3 -m uvicorn swanboard.app:app --host 0.0.0.0 --port 5173 --log-level info
directory=/app
autostart=true
autorestart=true
priority=600
stdout_logfile=/app/logs/swanlab.log
stderr_logfile=/app/logs/swanlab.error.log
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"
user=root
startsecs=30
startretries=3
