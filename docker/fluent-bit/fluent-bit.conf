    json_date_key       timestamp
    json_date_format    iso8601
    http_user           ${CLICKHOUSE_USER}
    http_passwd         ${CLICKHOUSE_PASS}

# Debug outputs
[OUTPUT]
    Name    stdout
    Match   swanlab

[OUTPUT]
    Name    stdout
    Match   metrics
