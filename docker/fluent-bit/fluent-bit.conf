[SERVICE]
    Flush           3
    Log_Level       debug
    Parsers_File    parsers.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020

[INPUT]
    Name             tail
    Tag              metrics
    Path             ${LOG_PATH}
    Read_from_Head   true
    parser           sh_json
    DB               /data/house.db

[INPUT]
    Name             http
    Tag              swanlab
    Listen           0.0.0.0
    Port             24224
[FILTER]
    Name    rewrite_tag
    Match   metrics
    Rule    $log_type ^(log|runtime|column|metric)$ metrics.$log_type false

[FILTER]
    Name    rewrite_tag
    Match   swanlab
    Rule    $log_type ^(log|runtime|column|metric)$ swanlab.$log_type false
# log - 终端日志
[OUTPUT]
    Name                http
    Match               metrics.log
    Host                ${CLICKHOUSE_HOST}
    Port                ${CLICKHOUSE_PORT}
    URI                 /?query=INSERT+INTO+app.log+FORMAT+JSONEachRow
    Format              json_stream
    json_date_key       timestamp
    json_date_format    iso8601
    http_user           ${CLICKHOUSE_USER}
    http_passwd         ${CLICKHOUSE_PASS}
[OUTPUT]
    Name  counter
    Match metrics.log

# runtime - 运行时信息
[OUTPUT]
    Name                http
    Match               metrics.runtime
    Host                ${CLICKHOUSE_HOST}
    Port                ${CLICKHOUSE_PORT}
    URI                 /?query=INSERT+INTO+app.runtime+FORMAT+JSONEachRow
    Format              json_stream
    json_date_key       timestamp
    json_date_format    iso8601
    http_user           ${CLICKHOUSE_USER}
    http_passwd         ${CLICKHOUSE_PASS}
[OUTPUT]
    Name  counter
    Match metrics.runtime

# column - 列信息
[OUTPUT]
    Name                http
    Match               metrics.column
    Host                ${CLICKHOUSE_HOST}
    Port                ${CLICKHOUSE_PORT}
    URI                 /?query=INSERT+INTO+app.column+FORMAT+JSONEachRow
    Format              json_stream
    json_date_key       timestamp
    json_date_format    iso8601
    http_user           ${CLICKHOUSE_USER}
    http_passwd         ${CLICKHOUSE_PASS}
[OUTPUT]
    Name  counter
    Match metrics.column

# metric - 指标数据
[OUTPUT]
    Name                http
    Match               metrics.metric
    Host                ${CLICKHOUSE_HOST}
    Port                ${CLICKHOUSE_PORT}
    URI                 /?query=INSERT+INTO+app.metric+FORMAT+JSONEachRow
    Format              json_stream
    json_date_key       timestamp
    json_date_format    iso8601
    http_user           ${CLICKHOUSE_USER}
    http_passwd         ${CLICKHOUSE_PASS}
[OUTPUT]
    Name  counter
    Match metrics.metric

# SwanLab HTTP input outputs
[OUTPUT]
    Name                http
    Match               swanlab.log
    Host                ${CLICKHOUSE_HOST}
    Port                ${CLICKHOUSE_PORT}
    URI                 /?query=INSERT+INTO+app.log+FORMAT+JSONEachRow
