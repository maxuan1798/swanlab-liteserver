    json_date_format    iso8601
    http_user           ${CLICKHOUSE_USER}
    http_passwd         ${CLICKHOUSE_PASS}

[OUTPUT]
    Name                http
    Match               swanlab.column
    Host                ${CLICKHOUSE_HOST}
    Port                ${CLICKHOUSE_PORT}
    URI                 /?query=INSERT+INTO+app.column+FORMAT+JSONEachRow
    Format              json_stream
