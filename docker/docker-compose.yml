version: '3.8'

services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: swanlab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-swanlab123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-swanlab_cloud}
      MYSQL_USER: ${MYSQL_USER:-swanlab_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-swanlab456}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/conf.d:/etc/mysql/conf.d
    networks:
      - swanlab-network
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=1000
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-swanlab123}"]
      timeout: 20s
      retries: 10
      interval: 30s
      start_period: 60s

  # ClickHouse 数据库（从 docker-compose-db 合并）
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: swanlab-clickhouse
    ports:
      - "18123:8123"  # HTTP interface (host -> container)，由 8123 调整到 18123
      - "19000:9000"  # Native interface (host -> container)，由 9002 调整到 19000
    environment:
      CLICKHOUSE_DB: swanlab
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASS:-password123}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    networks:
      - swanlab-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping" ]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 30s

  # Fluent Bit 日志收集器（从 docker-compose-db 合并）
  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: swanlab-fluent-bit
    ports:
      - "24224:24224"  # HTTP input
      - "2020:2020"    # Monitoring
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASS: ${CLICKHOUSE_PASS:-password123}
      LOG_PATH: ${LOG_PATH:-/logs/*.log}
      FLB_LOG_LEVEL: ${FLB_LOG_LEVEL:-debug}
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./fluent-bit/parsers.conf:/conf/parsers.conf
      - swanlab_logs:/logs
      - fluent_bit_data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
      swanlab-server:
        condition: service_started
    networks:
      - swanlab-network

  # MinIO 对象存储（从 docker-compose-db 合并）
  minio:
    image: minio/minio:latest
    container_name: swanlab-minio
    ports:
      - "9100:9000"     # API port (host -> container)，由 9000 调整到 9100
      - "9101:9001"     # Console port (host -> container)，由 9001 调整到 9101
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - swanlab-network

  # SwanLab-server服务
  swanlab-server:
    build: ..
    container_name: swanlab-server
    restart: unless-stopped
    environment:
      # 云端同步配置
      SWANLAB_CLOUD_SYNC: ${SWANLAB_CLOUD_SYNC:-1}

      # MySQL配置（用于云端同步的MySQL模式）
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-swanlab_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-swanlab456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-swanlab_cloud}
      MYSQL_CHARSET: utf8mb4
      MYSQL_MAX_CONNECTIONS: 20

      # ClickHouse配置
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASS: ${CLICKHOUSE_PASS:-password123}

      # MinIO配置
      MINIO_ENDPOINT: http://minio:9000

      # API配置（用于HTTP模式）
      SWANLAB_API_HOST: http://localhost:5173/api/v1/cloud
      SWANLAB_API_KEY: ${SWANLAB_API_KEY:-}
      SWANLAB_WORKSPACE: ${SWANLAB_WORKSPACE:-default}
      SWANLAB_CLOUD_TIMEOUT: 30

      # 权限配置
      SWANLAB_ALLOWED_WORKSPACES: ${SWANLAB_ALLOWED_WORKSPACES:-default,demo,test}

      # 数据目录
      SWANLAB_LOG_DIR: /app/logs
      SWANLAB_DATA_DIR: /app/data

      # Python配置
      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
    ports:
      - "${DASHBOARD_PORT:-5173}:5173"
    volumes:
      - swanlab_data:/app/data
      - swanlab_logs:/app/logs
    networks:
      - swanlab-network
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5173/api/v1/cloud/health" ]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 60s

  # Redis缓存服务（可选，用于会话存储和缓存）
  redis:
    image: redis:7-alpine
    container_name: swanlab-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16379}:6379"   # 将宿主机默认端口从 6379 改为 16379，容器内部仍为 6379
    volumes:
      - redis_data:/data
    networks:
      - swanlab-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
      interval: 10s

  # Nginx反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: swanlab-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - swanlab-network
    depends_on:
      - swanlab-dashboard
    profiles:
      - production

# 网络配置
networks:
  swanlab-network:
    driver: bridge

# 数据卷配置（合并所有服务所需卷）
volumes:
  mysql_data:
    driver: local
  swanlab_data:
    driver: local
  swanlab_logs:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local
  fluent_bit_data:
    driver: local
  minio_data:
    driver: local
