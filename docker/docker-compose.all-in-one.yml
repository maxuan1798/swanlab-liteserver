version: '3.8'

services:
  swanlab-all-in-one:
    build:
      context: ..
      dockerfile: Dockerfile.all-in-one
    container_name: swanlab-all-in-one
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:8800"       # Nginx
    environment:
      # MySQL配置
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-swanlab_root_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-swanlab_cloud}
      MYSQL_USER: ${MYSQL_USER:-swanlab_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-swanlab_user_456}

      # ClickHouse配置
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-password123}

      # MinIO配置
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}

      # Redis配置
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # SwanLab配置
      SWANLAB_CLOUD_SYNC: ${SWANLAB_CLOUD_SYNC:-1}
      SWANLAB_LOG_DIR: /app/logs
      SWANLAB_DATA_DIR: /app/data

      # 内部服务连接配置
      MYSQL_HOST: localhost
      MYSQL_PORT: 3306
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: 9000
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://localhost:9100
      MINIO_BUCKET: ${MINIO_BUCKET:-swanlab-media}

      # Python配置
      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
    volumes:
      - swanlab_data:/app/data
      - swanlab_logs:/app/logs
      - swanlab_storage:/data
      - mysql_data:/var/lib/mysql
      - clickhouse_data:/var/lib/clickhouse
      - redis_data:/var/lib/redis
      - minio_data:/data/minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/api/v1/cloud/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  swanlab_data:
    driver: local
  swanlab_logs:
    driver: local
  swanlab_storage:
    driver: local
  mysql_data:
    driver: local
  clickhouse_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
